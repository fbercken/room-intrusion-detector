name: Build and Push Docker Image

on:
  push:
    branches:
      - main # Triggers when code is pushed to main branch

env:
  REGISTRY: docker.io
  IMAGE_NAME: tessarine/room-intrusion-detector

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-helm-values:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: fbercken/room-intrusion-detector
          token: ${{ secrets.GH_PAT }} # Personal Access Token with repo write access
          fetch-depth: 0

      - name: Update image tag in values.yaml
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          # Update the tag field in values.yaml automatically using sed
          sed -i 's/tag: ".*"/tag: "sha-'$SHORT_SHA'"/' values.yaml


          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git commit -am "chore(helm): update image tag to sha-$SHORT_SHA"
          git push
